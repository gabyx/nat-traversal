name: "Setup Nix Environment"
description: "Sets up Nix and Cachix"

runs:
  using: "composite"
  steps:
    - uses: cachix/install-nix-action@v31
      with:
        nix_path: nixpkgs=channel:nixos-unstable
    - uses: Mic92/hestia@v3
    - name: bootstrap
      run: nix profile install "./tools/nix#bootstrap"
      shell: bash
