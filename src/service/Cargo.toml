[package]
  name = 'service'
  version = '0.0.1'
  edition = "2024"
  description = "Test example for NAT traversal with Rust. A learning project."
  homepage = "https://github.com/gabyx/nat-traversal"
  keywords = []
  authors = [
    "Gabriel Nützi"
  ]

[dependencies]
  anyhow = "1.0.102"
  clap = { version = "4.6.0", features = ['derive']}
  common = {  workspace = true }
  serde = { version = "1", features = ["derive"] }
  postcard = { version = "1", features = ["use-std"] }
  slog = "2.8.2"
  slog-async = "2.8.0"
  slog-term = "2.9.2"

[lints.clippy]
  pedantic = "deny"
  needless_return = "warn"
